<section id="hero" class="hero-section">
  <!-- Three.js Canvas -->
  <canvas #threeCanvas class="hero-canvas" aria-hidden="true"></canvas>

  <!-- Fallback gradient background -->
  <div class="hero-bg-gradient" [class.visible]="!webGLSupported"></div>

  <!-- Grid overlay -->
  <div class="hero-grid" aria-hidden="true"></div>

  <!-- Main content -->
  <div class="hero-content">
    <!-- Pre-title -->
    <div class="hero-pretitle reveal-up" data-delay="200">
      <span class="pulse-dot"></span>
      Available for Opportunities
    </div>

    <!-- Name + Title -->
    <div class="hero-name-wrapper">
      <p class="hero-greeting reveal-up" data-delay="300">Hello, I'm</p>
      <h1 class="hero-name reveal-up" data-delay="400">
        <span class="name-3d">KARTHIKEYAN</span>
      </h1>
      <div class="hero-titles reveal-up" data-delay="500">
        <span class="hero-title-badge">API Developer</span>
        <span class="hero-title-separator">·</span>
        <span class="hero-title-badge secondary">MCA Graduate</span>
      </div>
    </div>

    <!-- Description -->
    <p class="hero-description reveal-up" data-delay="600">
      I build scalable backend systems, robust REST APIs, and reliable web
      applications with clean architecture and modern technologies.
    </p>

    <!-- Tech stack icons row -->
    <div class="hero-stack reveal-up" data-delay="700">
      <span class="stack-label">Stack:</span>
      <div class="stack-tags">
        <span class="tech-badge">C# / ASP.NET</span>
        <span class="tech-badge">Node.js</span>
        <span class="tech-badge">SQL Server</span>
        <span class="tech-badge">Angular</span>
        <span class="tech-badge">REST APIs</span>
      </div>
    </div>

    <!-- CTA Buttons -->
    <div class="hero-actions reveal-up" data-delay="800">
      <button class="btn-primary magnetic-btn" (click)="scrollToProjects()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        View My Projects
      </button>
      <button class="btn-secondary magnetic-btn" (click)="scrollToContact()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
        </svg>
        Contact Me
      </button>
    </div>

    <!-- Social links -->
    <div class="hero-social reveal-up" data-delay="900">
      <a href="https://github.com/karthikeyan" target="_blank" rel="noopener" class="social-pill" aria-label="GitHub">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
        GitHub
      </a>
      <a href="https://linkedin.com/in/karthikeyan" target="_blank" rel="noopener" class="social-pill" aria-label="LinkedIn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
          <rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>
        </svg>
        LinkedIn
      </a>
    </div>
  </div>

  <!-- Scroll indicator -->
  <button class="scroll-indicator" (click)="scrollDown()" aria-label="Scroll down">
    <div class="scroll-mouse">
      <div class="scroll-wheel"></div>
    </div>
    <span>Scroll</span>
  </button>

  <!-- Bottom fade -->
  <div class="hero-bottom-fade" aria-hidden="true"></div>
</section>
